# 일지 정리(추출) 평가 세트(Spec 5.5, 계획서 M2-05). 걸으며 나눈 대화 전문과 사람이 정한 정답(아이디어·할 일).
# 정답 기준: 사용자가 말했거나 받아들인 것만(말한 그대로, 조건을 덧붙이지 않는다). 캐릭터가 제안했지만 사용자가 받아들이지 않은 것은 넣지 않는다.
# role: user | assistant (assistant 화자 이름은 실행할 때 페르소나 YAML에서 붙인다)
# saved: 대화 중 save_note로 이미 저장한 노트 [종류(idea|todo|memo), 내용]. 정답에는 넣지 않는다
# rejected: 캐릭터가 제안했지만 사용자가 받아들이지 않은 것(거절·무응답·화제 전환·"음" 같은 맞장구).
#   아이디어·할 일·메모 어디에도 뽑히면 안 된다(Spec 5.5: 12개 중 3개 이상 이런 케이스)
# v1 세트에서 web-search(검색은 M5)와 small-talk을 무응답·맞장구 케이스로 바꿨다(새 케이스도 아이디어 없는 대화를 포함한다)
cases:
  - id: trash-map
    note: 기본 브레인스토밍. 아이디어 2개, 할 일 1개
    turns:
      - [assistant, "다니엘님, 안녕하세요! 오늘은 무슨 생각 하면서 걸을까요?"]
      - [user, "등산하는데 쓰레기통이 하나도 없더라. 등산로 쓰레기통 위치를 지도로 모아 보면 어떨까 싶어."]
      - [assistant, "오, 완전 좋은데요?! 그거 제일 먼저 쓸 사람은 누구일까요?"]
      - [user, "주말에 산 타는 사람들이지. 아 그리고 쓰레기통이 꽉 찼는지 사람들이 제보하는 기능도 있으면 좋겠다."]
      - [assistant, "제보 기능까지! 대박이에요. 그럼 첫 단계로 뭘 해 보면 좋을까요?"]
      - [user, "일단 공공데이터 포털에 쓰레기통 위치 데이터가 있는지 찾아봐야겠어."]
      - [assistant, "좋아요! 데이터부터 확인하는 거 딱이에요."]
    gold:
      ideas:
        - 등산로 쓰레기통 위치를 모은 지도
        - 쓰레기통이 꽉 찼는지 사용자가 제보하는 기능
      todos:
        - 공공데이터 포털에서 쓰레기통 위치 데이터 찾아보기

  - id: rejected-suggestion
    note: 캐릭터 제안을 사용자가 거절. 거절한 것은 정답이 아니다
    turns:
      - [assistant, "다니엘님, 좋은 아침이에요! 오늘은 어떤 이야기 할까요?"]
      - [user, "동네 빵집들 갓 나온 빵 시간을 알려 주는 알림 서비스를 생각해 봤어."]
      - [assistant, "오 그거 너무 좋아요! 이거 로봇이랑 붙여서 빵 배달까지 하면 어때요?"]
      - [user, "아니 배달은 너무 커. 그건 빼자. 빵 나오는 시간만 알려 주는 걸로."]
      - [assistant, "알겠어요, 깔끔하게 알림만! 빵집 사장님들은 어떻게 참여하게 할까요?"]
      - [user, "사장님이 버튼 하나만 누르면 알림이 가게 하면 될 것 같아. 이번 주에 단골 빵집 사장님한테 물어봐야지."]
    rejected:
      - 빵 배달까지 하는 기능(로봇과 연결)
    gold:
      ideas:
        - 동네 빵집의 갓 나온 빵 시간을 알려 주는 알림 서비스
        - 빵집 사장님이 버튼 하나로 알림을 보내는 방식
      todos:
        - 이번 주에 단골 빵집 사장님에게 의견 물어보기

  - id: hmm-reply
    note: 캐릭터 제안에 "음"·"글쎄"로만 답한 잡담. 아이디어·할 일이 없다
    turns:
      - [assistant, "다니엘님, 좋은 저녁이에요! 오늘 걷기 어때요?"]
      - [user, "좀 지쳤어. 그냥 천천히 걷는 중이야."]
      - [assistant, "천천히 걷는 것도 완전 좋죠! 걸으면서 하루를 돌아보는 짧은 음성 일기를 남겨 보는 건 어때요?"]
      - [user, "음..."]
      - [assistant, "한 문장만 남겨도 돼요! 아니면 하루 걸음 수 목표를 정해 보는 것도 재밌을 것 같아요."]
      - [user, "글쎄. 오늘은 그냥 아무 생각 안 하고 싶어."]
      - [assistant, "그럼요, 오늘은 편하게 걸어요!"]
    rejected:
      - 걸으면서 하루를 돌아보는 짧은 음성 일기 남기기
      - 하루 걸음 수 목표 정하기
    gold:
      ideas: []
      todos: []

  - id: todos-with-time
    note: 시간이 들어간 할 일 여러 개. 숫자를 지켜야 한다
    turns:
      - [assistant, "다니엘님, 오늘 뭐 정리할 거 있어요?"]
      - [user, "오늘 할 게 좀 많아. 3시에 치과 예약 확인 전화해야 하고."]
      - [assistant, "치과 전화, 3시! 또 있어요?"]
      - [user, "저녁 7시까지 팀 발표 자료 초안을 보내야 해. 그리고 내일 아침에 우유 2개 사기."]
      - [assistant, "세 가지네요! 다 기억해 둘게요."]
    gold:
      ideas: []
      todos:
        - 3시에 치과에 예약 확인 전화하기
        - 저녁 7시까지 팀 발표 자료 초안 보내기
        - 내일 아침에 우유 2개 사기

  - id: ignored-suggestion
    note: 캐릭터 제안에 답하지 않고 화제를 바꾸거나 대답 없이 끝남. 사용자가 말한 것만 정답이다
    turns:
      - [assistant, "다니엘님, 안녕하세요! 오늘은 무슨 생각 하면서 걸을까요?"]
      - [user, "출퇴근길에 듣기 좋은 팟캐스트를 직접 만들어 보고 싶어. 주제는 동네 맛집 이야기로."]
      - [assistant, "오, 동네 맛집 팟캐스트 완전 좋은데요?! 매회 가게 사장님 인터뷰를 넣어 보면 어때요?"]
      - [user, "그나저나 오늘 공기 진짜 맑다. 저기 벚나무는 벌써 단풍 들었네."]
      - [assistant, "와, 가을이 성큼 왔네요! 단풍 색이 어때요?"]
      - [user, "빨갛게 잘 들었어. 아 맞다, 팟캐스트 녹음용 마이크를 이번 주에 하나 알아봐야겠다."]
      - [assistant, "마이크부터 준비하는 거 딱이에요! 동네 상인회랑 같이 홍보해 보는 건 어때요?"]
    rejected:
      - 매회 가게 사장님 인터뷰 넣기
      - 동네 상인회와 같이 홍보하기
    gold:
      ideas:
        - 동네 맛집 이야기를 다루는 출퇴근길 팟캐스트
      todos:
        - 이번 주에 팟캐스트 녹음용 마이크 알아보기

  - id: idea-evolution
    note: 아이디어가 발전한다. 발전한 최종 아이디어 하나와 할 일
    turns:
      - [assistant, "다니엘님, 오늘은 어떤 이야기 할까요?"]
      - [user, "식물 물 주는 걸 자꾸 까먹어. 물 줄 때 알려 주는 앱 어때?"]
      - [assistant, "좋아요! 비슷한 걸 본 적 있으세요?"]
      - [user, "있긴 한데 다 귀찮아. 아예 화분에 꽂는 습도 센서랑 연결해서 마를 때만 알려 주면 좋겠다."]
      - [assistant, "센서 연결이라니 대박! 그럼 첫 할 일은 뭐가 좋을까요?"]
      - [user, "아두이노 습도 센서 가격부터 알아볼래. 그리고 주말에 베란다 화분 개수 세 보기."]
    gold:
      ideas:
        # 처음 말한 "물 줄 때 알려 주는 앱"을 센서 방식으로 발전시켰다. 하나로 본다
        - 화분 습도 센서와 연결해 흙이 마를 때만 물 줄 때를 알려 주는 앱
      todos:
        - 아두이노 습도 센서 가격 알아보기
        - 주말에 베란다 화분 개수 세 보기

  - id: negation
    note: 하지 않기로 한 일. 부정을 뒤집으면 안 된다
    turns:
      - [assistant, "다니엘님, 오늘 계획 있어요?"]
      - [user, "원래 이번 주말에 등산 가려고 했는데 안 가기로 했어. 비 온대."]
      - [assistant, "아쉽네요! 그럼 주말엔 뭐 하실 거예요?"]
      - [user, "집에서 밀린 블로그 글 하나 쓰려고. 주제는 지난달 다녀온 지리산 후기."]
      - [assistant, "지리산 후기 완전 기대돼요!"]
      - [user, "아 그리고 블로그에 등산 장비 리뷰 시리즈를 연재해 보면 어떨까 생각 중이야."]
    gold:
      ideas:
        - 블로그에 등산 장비 리뷰 시리즈 연재하기
      todos:
        - 이번 주말에 지리산 후기 블로그 글 쓰기

  - id: long-brainstorm
    note: 아이디어가 많은 긴 대화
    turns:
      - [assistant, "다니엘님, 오늘은 무슨 생각 하면서 걸을까요?"]
      - [user, "산책 앱을 만들고 싶어. 걸으면서 음성으로 메모하는 거."]
      - [assistant, "오 완전 좋아요! 누가 쓰면 좋을까요?"]
      - [user, "아이디어 많은 직장인들. 그리고 메모를 걸은 경로 지도 위에 핀으로 꽂아 주면 좋겠어."]
      - [assistant, "경로 위 메모 핀이라니 대박이에요! 또 있어요?"]
      - [user, "주간 요약을 금요일 저녁에 음성으로 들려주는 것도. 아 그리고 친구랑 같은 산책길 메모를 공유하는 기능."]
      - [assistant, "공유까지! 그중에 제일 끌리는 건 뭐예요?"]
      - [user, "경로 지도 핀이 제일 좋아. 이번 주에 지도 API 무료 사용량부터 비교해 볼게."]
      - [assistant, "좋아요, 지도 API 비교부터!"]
    gold:
      ideas:
        - 걸으면서 음성으로 메모하는 산책 앱
        - 메모를 걸은 경로 지도 위에 핀으로 표시
        - 금요일 저녁에 주간 요약을 음성으로 들려주기
        - 친구와 같은 산책길 메모를 공유하는 기능
      todos:
        - 이번 주에 지도 API 무료 사용량 비교하기

  - id: interrupted
    note: 답변이 중간에 끊긴 대화(말이 끊김 표시)
    turns:
      - [assistant, "다니엘님, 반가워요! 오늘은 뭐 할까요?"]
      - [user, "아이들 용돈 관리 앱 생각해 봤어. 저금하면 캐릭터가 자라는 거."]
      - [assistant, "와 캐릭터가 자라는 거 완전 귀엽…"]
      - [user, "잠깐, 그리고 부모가 미션을 주면 용돈을 주는 기능도."]
      - [assistant, "미션 용돈 좋아요! 그럼 처음엔 뭘 해 볼까요?"]
      - [user, "조카한테 어떤 캐릭터가 좋은지 물어볼게."]
    interrupted: [2]
    gold:
      ideas:
        - 저금하면 캐릭터가 자라는 아이 용돈 관리 앱
        - 부모가 미션을 주면 용돈을 주는 기능
      todos:
        - 조카에게 어떤 캐릭터가 좋은지 물어보기

  - id: memo-vs-todo
    note: 기억할 정보(메모)와 할 일이 섞임. 메모는 아이디어·할 일 정답에 넣지 않는다
    turns:
      - [assistant, "다니엘님, 오늘 걷기 어때요?"]
      - [user, "좋아. 아 참, 동네 도서관이 다음 달부터 월요일 휴관이래."]
      - [assistant, "오 그거 기억해 둘 만하네요!"]
      - [user, "응. 그래서 빌린 책은 이번 일요일까지 반납해야겠다."]
      - [assistant, "일요일 반납, 꼭 기억해요!"]
      - [user, "그리고 도서관 빈자리를 알려 주는 알림이 있으면 좋겠다는 생각이 들었어."]
    gold:
      ideas:
        - 도서관 빈자리를 알려 주는 알림
      todos:
        - 빌린 책을 이번 일요일까지 반납하기

  - id: saved-during-talk
    note: 대화 중 할 일을 이미 저장함(괄호 맥락 붙음). 같은 할 일을 다시 뽑지 않아야 한다
    saved:
      - [todo, "이번 주에 공원 관리사무소에 문의해서 반려견 놀이터 위치 확인하기 (동네 공원 반려견 놀이터 지도 만들기 첫 단계)"]
    turns:
      - [assistant, "다니엘님, 안녕하세요! 오늘은 어떤 이야기 할까요?"]
      - [user, "동네 공원에 반려견 놀이터 위치를 모은 지도를 만들면 어떨까?"]
      - [assistant, "오, 완전 좋은데요?! 이 지도를 제일 먼저 쓰면 좋아할 사람은 누구일까요?"]
      - [user, "첫 단계로 이번 주에 공원 관리사무소에 문의해 볼게."]
      - [assistant, "대박, 벌써 첫 걸음까지! 공원 관리사무소 문의는 할 일로 저장해 뒀어요. 전화할 때 또 물어볼 게 있을까요?"]
      - [user, "음 그건 아직 모르겠어. 그냥 걸을래."]
    gold:
      ideas:
        - 동네 공원의 반려견 놀이터 위치를 모은 지도
      todos: []

  - id: saved-idea-and-open-questions
    note: 아이디어를 이미 저장함. 답하지 않은 질문·정하지 않은 것은 메모가 아니다
    saved:
      - [idea, "걸으면서 영어 단어를 외우는 오디오 앱 만들기"]
    turns:
      - [assistant, "다니엘님, 오늘은 무슨 생각 하면서 걸을까요?"]
      - [user, "걸으면서 영어 단어를 외우는 오디오 앱 어때?"]
      - [assistant, "오, 화면 안 봐도 되니까 산책이랑 찰떡이잖아요! 아이디어로 저장해 뒀어요. 이 앱을 제일 잘 쓸 사람은 누구일까요?"]
      - [user, "글쎄, 그건 나중에 생각할래. 오늘 밤에 단어 목록 100개부터 정리해 볼게."]
      - [assistant, "100개면 첫 시제품으로 딱이에요! 어떤 단어로 채울 생각이세요?"]
      - [user, "그것도 아직. 아 참, 발음은 미국식으로 하고 싶어."]
    gold:
      ideas: []
      todos:
        - 오늘 밤 영어 단어 목록 100개 정리하기

# 출처 인용 케이스(M5-10). 위 cases와 따로 채점한다(채점 모델 없이 번호만 자동 비교, cited.py).
# sources: 대화 중 캐릭터가 본 검색·읽기 결과 [제목, URL](번호는 1부터 순서대로, 모델에 <출처> 목록으로 간다)
# must_cite: 요약·메모 어딘가에서 근거로 인용돼야 하는 출처 번호(검색에서 나온 사실이 일지에 들어간 경우)
# no_cite: 인용하면 안 되는 출처 번호(대화와 관련 없는 검색 결과)
# 출처가 없는 케이스(sources 없음)는 모든 sources가 빈 목록이어야 한다
cited_cases:
  - id: cited-weather
    note: 날씨 검색 결과를 쓴 대화. 기상청 출처는 인용, 관련 없는 쇼핑 출처는 인용하지 않는다
    sources:
      - ["기상청 동네예보: 북한산 이번 주말 맑음", "https://www.kma.go.kr/forecast/bukhan"]
      - ["등산화 할인 모음", "https://shop.example.com/hiking-shoes"]
    must_cite: [1]
    no_cite: [2]
    turns:
      - [assistant, "다니엘님, 안녕하세요! 오늘은 어디 갈 계획이에요?"]
      - [user, "이번 주말에 북한산 가려고. 날씨 좀 찾아봐 줘."]
      - [assistant, "찾아봤어요! 기상청 예보로는 토요일은 맑고 일요일은 오후부터 흐려진대요."]
      - [user, "그럼 토요일 아침 일찍 가야겠다. 도시락은 내가 싸 갈게."]
      - [assistant, "좋아요! 토요일 아침 산행, 딱이에요."]

  - id: cited-two-sources
    note: 서로 다른 두 출처에서 각각 사실을 얻은 대화. 두 출처 모두 인용돼야 한다
    sources:
      - ["설악산 단풍 절정 시기 안내", "https://news.example.com/seorak-foliage"]
      - ["설악산 탐방로 통제 구간 공지", "https://www.knps.or.kr/notice/seorak"]
    must_cite: [1, 2]
    no_cite: []
    turns:
      - [assistant, "다니엘님, 좋은 아침이에요! 오늘은 무슨 이야기 할까요?"]
      - [user, "다음 달에 설악산 단풍 보러 가고 싶어. 언제가 절정인지 찾아봐 줘."]
      - [assistant, "기사에 따르면 올해 설악산 단풍 절정은 10월 셋째 주쯤이래요."]
      - [user, "그렇구나. 혹시 막힌 등산로는 없어? 그것도 확인해 줘."]
      - [assistant, "국립공원 공지로는 대청봉 쪽 일부 구간이 보수 공사로 통제돼 있대요."]
      - [user, "알겠어. 그럼 통제 안 된 코스로 잡아야겠다."]

  - id: cited-none
    note: 검색하지 않은 대화. 출처가 없으니 모든 인용은 빈 목록이다
    turns:
      - [assistant, "다니엘님, 안녕하세요! 오늘은 어떤 생각 하면서 걸을까요?"]
      - [user, "걷다 보니까 산책로 벤치마다 이야기를 적어 두는 노트가 있으면 재미있겠다 싶었어."]
      - [assistant, "벤치 노트! 걷는 사람들이 한 줄씩 남기는 거네요. 너무 좋은데요?"]
      - [user, "응, 이번 주말에 동네 공원 벤치 몇 개나 있는지 세어 봐야겠다."]
