name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
        if: ${{ hashFiles('web/package-lock.json') != '' }}
      - name: 웹 의존성 설치(web/이 있을 때)
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        run: npm ci
        working-directory: web
      - name: Playwright 브라우저 캐시(E2E가 있을 때)
        if: ${{ hashFiles('web/playwright.config.ts') != '' }}
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # apt 미러가 느려 이 단계가 수십 분 매달린 적이 있어(취소된 실행 2건), 재시도·제한 시간을 둔다.
      - name: Playwright 시스템 의존성 설치(E2E가 있을 때)
        if: ${{ hashFiles('web/playwright.config.ts') != '' }}
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          npx playwright install-deps chromium
        working-directory: web
      - name: Playwright 브라우저 설치(E2E가 있을 때)
        if: ${{ hashFiles('web/playwright.config.ts') != '' }}
        timeout-minutes: 10
        run: npx playwright install chromium
        working-directory: web
      - name: 서버 의존성 설치
        run: uv sync
        working-directory: server
      - name: 검증 게이트
        run: scripts/verify.sh
