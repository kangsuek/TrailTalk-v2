name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
        if: ${{ hashFiles('web/package-lock.json') != '' }}
      - name: 웹 의존성 설치(web/이 있을 때)
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        run: npm ci
        working-directory: web
      - name: Playwright 브라우저 캐시(E2E가 있을 때)
        if: ${{ hashFiles('web/playwright.config.ts') != '' }}
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # install-deps(apt)는 느린 미러로 10분 제한에 걸린 적이 있다(런너 이미지에 Chromium 구동 라이브러리가 이미 있고
      # 헤드리스 E2E에는 폰트·xvfb가 필요 없다). 라이브러리가 모자라 브라우저가 안 뜨면 이 단계를 되살린다.
      - name: Playwright 브라우저 설치(E2E가 있을 때)
        if: ${{ hashFiles('web/playwright.config.ts') != '' }}
        timeout-minutes: 10
        run: npx playwright install chromium
        working-directory: web
      - name: 서버 의존성 설치
        run: uv sync
        working-directory: server
      - name: 검증 게이트
        run: scripts/verify.sh
