name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
        if: ${{ hashFiles('web/package-lock.json') != '' }}
      - name: 웹 의존성 설치(web/이 있을 때)
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        run: npm ci
        working-directory: web
      - name: Playwright 브라우저 캐시(E2E가 있을 때)
        if: ${{ hashFiles('web/playwright.config.ts') != '' }}
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # apt 미러가 느려 이 단계가 수십 분 매달린 적이 있어(취소된 실행 2건), 재시도·제한 시간을 둔다.
      - name: Playwright 시스템 의존성 설치(E2E가 있을 때)
        if: ${{ hashFiles('web/playwright.config.ts') != '' }}
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          npx playwright install-deps chromium
        working-directory: web
      - name: Playwright 브라우저 설치(E2E가 있을 때)
        if: ${{ hashFiles('web/playwright.config.ts') != '' }}
        timeout-minutes: 10
        run: npx playwright install chromium
        working-directory: web
      - name: 서버 의존성 설치
        run: uv sync
        working-directory: server
      - name: 검증 게이트
        run: scripts/verify.sh
      # Linux 시각 기준 이미지가 아직 없으면(M0·M3-16 약속) 시각 시험이 건너뛰어지므로, 이 실행에서 이미지를
      # 새로 만들어 산출물로 올린다. 받아서 눈으로 확인하고 승인한 것만 web/e2e/__screenshots__/linux/에
      # 커밋한다(그 폴더가 생기면 이 단계는 더 돌지 않는다). 실패해도 검증 결과에는 영향이 없다.
      - name: Linux 시각 기준 이미지 생성(기준이 없을 때만)
        if: ${{ hashFiles('web/playwright.config.ts') != '' && hashFiles('web/e2e/__screenshots__/linux/**') == '' }}
        continue-on-error: true
        run: npx playwright test e2e/visual.spec.ts e2e/visual-journal.spec.ts e2e/visual-voice.spec.ts --update-snapshots=all
        working-directory: web
      - name: Linux 시각 기준 이미지 업로드
        if: ${{ hashFiles('web/playwright.config.ts') != '' && hashFiles('web/e2e/__screenshots__/linux/**') == '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baseline
          path: web/e2e/__screenshots__/linux/
          if-no-files-found: warn
