<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설정 · 보관 화면 앱</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.app{width:360px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#F3F0E8;color:#16241D;overflow:hidden}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd2{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #DDD8CB}
.ttl{font-size:20px;font-weight:700}
.body{flex:1;min-height:0;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:14px}
.sec{background:#fff;border:1px solid #DDD8CB;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.lb{font-size:15px;font-weight:700}
.ds{font-size:13px;line-height:1.45;color:#4A5A52}
.vr{display:flex;align-items:center;gap:10px;border:1.5px solid #DDD8CB;border-radius:12px;padding:4px 12px;min-height:52px;background:#fff}
.vr.on{border-color:#1D5B43;background:#EEF5F0}
.rd{width:22px;height:22px;border-radius:50%;border:2px solid #9AA59E;flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.vr.on .rd{border-color:#1D5B43;background:#1D5B43}
.vr.on .rd i{width:8px;height:8px;border-radius:50%;background:#fff;display:block}
.kv{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;font-size:15px}
.tabs{height:64px;flex:none;display:flex;background:#fff;border-top:1px solid #DDD8CB}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#4A5A52;font-weight:500}
.tab.on{color:#1D5B43;font-weight:700}
</style>
</helmet>
<div class="app">
  <header class="hd2">
    <h1 class="ttl" style="margin:0">설정</h1>
    <span style="font-size:13px;font-weight:700;color:#14452F;display:flex;align-items:center;gap:4px">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M5 12l4 4 10-10"/></svg>
      저장됨
    </span>
  </header>

  <main class="body">
    <section class="sec" aria-label="음성 원본 보관">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span class="lb">음성 원본 30일 보관</span>
        <button role="switch" aria-checked="false" aria-label="음성 원본 보관" style="width:56px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:flex-end">
          <span style="width:52px;height:32px;border-radius:16px;background:#C9C3B3;position:relative;display:block"><i style="position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);display:block"></i></span>
        </button>
      </div>
      <div class="ds">켜면 음성 대화의 녹음을 내 서버에 30일 동안 보관해요. 끄면 저장하지 않고, 이미 저장한 녹음도 30일 뒤 지워요.</div>
    </section>

    <section class="sec" aria-label="화면 모드">
      <span class="lb">화면 모드</span>
      <div class="vr on">
        <span class="rd"><i></i></span>
        <span style="flex:1;font-size:15px;font-weight:700">시스템 설정 따르기</span>
        <span style="display:flex"><i style="width:18px;height:18px;border-radius:50%;background:#F3F0E8;border:1px solid #9AA59E;display:block"></i><i style="width:18px;height:18px;border-radius:50%;background:#0D1612;border:1px solid #9AA59E;display:block;margin-left:-6px"></i></span>
      </div>
      <div class="vr">
        <span class="rd"></span>
        <span style="flex:1;font-size:15px;font-weight:500">라이트</span>
        <i style="width:18px;height:18px;border-radius:50%;background:#F3F0E8;border:1px solid #9AA59E;display:block"></i>
      </div>
      <div class="vr">
        <span class="rd"></span>
        <span style="flex:1;font-size:15px;font-weight:500">다크</span>
        <i style="width:18px;height:18px;border-radius:50%;background:#0D1612;border:1px solid #9AA59E;display:block"></i>
      </div>
      <div class="ds">이 기기에만 적용돼요. 해 질 녘이나 밤 산책에는 다크가 눈이 편해요.</div>
    </section>

    <section class="sec" aria-label="앱 정보">
      <span class="lb">앱</span>
      <div style="display:flex;align-items:center;gap:10px;background:#F7E6C4;border-radius:12px;padding:8px 8px 8px 12px">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:#6E3B00;width:22px;height:22px"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg>
        <span style="flex:1;font-size:14px;font-weight:700;color:#4E2A00;line-height:1.4">새 버전이 있어요<br><span style="font-weight:500;font-size:12px;color:#5B3300">대화가 끝난 뒤에 적용하는 게 좋아요</span></span>
        <button style="height:44px;padding:0 16px;border:0;border-radius:10px;background:#6E3B00;color:#fff;font-size:14px;font-weight:700">적용</button>
      </div>
      <div class="kv"><span>서버 연결</span><span style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#14452F"><i style="width:8px;height:8px;border-radius:50%;background:#1D5B43;display:block"></i>연결됨</span></div>
      <div class="kv" style="border-top:1px solid #EEEADF"><span>캐릭터</span><span class="ds" style="font-size:14px">제니 · 설정 파일로 바꿔요</span></div>
      <div class="kv" style="border-top:1px solid #EEEADF"><span>버전</span><span class="ds" style="font-size:14px">TrailTalk v2.0</span></div>
    </section>
  </main>

  <nav class="tabs" aria-label="메인 메뉴">
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>대화</button>
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6"/></svg>일지</button>
    <button class="tab on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>설정</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
