<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설정 · 음성과 대화 모델 (다크)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0D1612}
button{font-family:inherit;cursor:pointer}
.app{width:360px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#0D1612;color:#EDEAE0;overflow:hidden}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd2{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #26382E}
.ttl{font-size:20px;font-weight:700}
.body{flex:1;min-height:0;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:14px}
.sec{background:#17241D;border:1px solid #2F4237;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.lb{font-size:15px;font-weight:700}
.ds{font-size:13px;line-height:1.45;color:#A9B7AE}
.vr{display:flex;align-items:center;gap:10px;border:1.5px solid #2F4237;border-radius:12px;padding:4px 4px 4px 12px;min-height:52px;background:#0D1612}
.vr.on{border-color:#4FB58D;background:#1A2D24}
.rd{width:22px;height:22px;border-radius:50%;border:2px solid #6B7C72;flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.vr.on .rd{border-color:#4FB58D;background:#4FB58D}
.vr.on .rd i{width:8px;height:8px;border-radius:50%;background:#0A1410;display:block}
.pl{width:44px;height:44px;border-radius:50%;border:1.5px solid #3A4F43;background:#1F2D26;color:#EDEAE0;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.tabs{height:64px;flex:none;display:flex;background:#141F19;border-top:1px solid #26382E}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#A9B7AE;font-weight:500}
.tab.on{color:#6BD0A4;font-weight:700}
</style>
</helmet>
<div class="app">
  <header class="hd2">
    <h1 class="ttl" style="margin:0">설정</h1>
    <span style="font-size:13px;font-weight:700;color:#6BD0A4;display:flex;align-items:center;gap:4px">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M5 12l4 4 10-10"/></svg>
      저장됨
    </span>
  </header>

  <main class="body">
    <section class="sec" aria-label="제니 목소리">
      <span class="lb">제니 목소리</span>
      <div class="ds">▶를 누르면 샘플 문장을 들려줘요. 다음 답변부터 바뀌어요.</div>
      <div class="vr on">
        <span class="rd"><i></i></span>
        <span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">nova</span><span class="ds" style="display:block">기본 · 밝고 쾌활해요</span></span>
        <button class="pl" aria-label="nova 미리 듣기"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M8 5l11 7-11 7z" style="fill:currentColor"/></svg></button>
      </div>
      <div class="vr">
        <span class="rd"></span>
        <span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">shimmer</span><span class="ds" style="display:block">맑고 부드러워요</span></span>
        <button class="pl" aria-label="shimmer 미리 듣기"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M8 5l11 7-11 7z" style="fill:currentColor"/></svg></button>
      </div>
      <div class="vr">
        <span class="rd"></span>
        <span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">alloy</span><span class="ds" style="display:block">차분하고 또렷해요</span></span>
        <button class="pl" aria-label="alloy 미리 듣기"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M8 5l11 7-11 7z" style="fill:currentColor"/></svg></button>
      </div>
    </section>

    <section class="sec" aria-label="말 속도">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lb">말 속도</span><span style="font-size:18px;font-weight:700;color:#6BD0A4">1.20배</span></div>
      <div style="position:relative;height:44px;margin:0 8px">
        <div style="position:absolute;left:0;right:0;top:19px;height:6px;border-radius:3px;background:#2B3E34"></div>
        <div style="position:absolute;left:0;width:60%;top:19px;height:6px;border-radius:3px;background:#4FB58D"></div>
        <div style="position:absolute;left:40%;top:14px;width:2px;height:16px;background:#A9B7AE" aria-hidden="true"></div>
        <button aria-label="말 속도 1.20배" style="position:absolute;left:calc(60% - 14px);top:8px;width:28px;height:28px;border-radius:50%;border:3px solid #0D1612;background:#4FB58D;box-shadow:0 1px 4px rgba(0,0,0,.6);padding:0"></button>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#A9B7AE;margin:0 2px"><span>느리게 0.75</span><span>기본 1.05</span><span>빠르게 1.5</span></div>
      <div style="display:flex;gap:8px;margin-top:2px">
        <button style="flex:1;height:44px;border:1.5px solid #3A4F43;border-radius:12px;background:#1F2D26;color:#EDEAE0;font-size:14px;font-weight:500">기본값으로</button>
        <button style="flex:1;height:44px;border:1.5px solid #4FB58D;border-radius:12px;background:transparent;color:#9ADBB9;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M8 5l11 7-11 7z" style="fill:currentColor"/></svg>이 속도로 듣기</button>
      </div>
      <div style="height:1px;background:#26382E;margin:4px 0" aria-hidden="true"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span style="flex:1"><span class="lb" style="display:block">맞장구 소리</span><span class="ds">답이 늦을 때 '음~' 같은 짧은 소리를 먼저 들려줘요.</span></span>
        <button role="switch" aria-checked="true" aria-label="맞장구 소리" style="width:56px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:flex-end">
          <span style="width:52px;height:32px;border-radius:16px;background:#4FB58D;position:relative;display:block"><i style="position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#0A1410;box-shadow:0 1px 3px rgba(0,0,0,.5);display:block"></i></span>
        </button>
      </div>
    </section>

    <section class="sec" aria-label="대화 모델">
      <span class="lb">대화 모델</span>
      <div style="display:flex;gap:4px;padding:4px;border-radius:14px;background:#0D1612">
        <button style="flex:1;border:0;border-radius:10px;background:transparent;color:#EDEAE0;padding:8px 2px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:2px"><b style="font-size:15px;font-weight:500">haiku</b><span style="font-size:12px;color:#A9B7AE">빠르게</span></button>
        <button style="flex:1;border:0;border-radius:10px;background:#4FB58D;color:#0A1410;padding:8px 2px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:2px"><b style="font-size:15px">sonnet</b><span style="font-size:12px">기본</span></button>
        <button style="flex:1;border:0;border-radius:10px;background:transparent;color:#EDEAE0;padding:8px 2px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:2px"><b style="font-size:15px;font-weight:500">opus</b><span style="font-size:12px;color:#A9B7AE">깊게</span></button>
      </div>
      <div class="ds">대화 중에도 바꿀 수 있고, 다음 답변부터 써요. 바꾼 직후 첫 답변은 조금 늦을 수 있어요.</div>
    </section>
  </main>

  <nav class="tabs" aria-label="메인 메뉴">
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>대화</button>
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6"/></svg>일지</button>
    <button class="tab on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>설정</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
