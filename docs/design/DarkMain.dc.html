<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시작 화면 (다크)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0D1612}
button{font-family:inherit;cursor:pointer}
.app{width:360px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#0D1612;color:#EDEAE0;overflow:hidden}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #26382E}
.who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:#2B7A5A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.nm{font-size:16px;font-weight:700;line-height:1.2}
.st{font-size:13px;color:#A9B7AE;line-height:1.2;margin-top:2px}
.use{width:108px;text-align:right}
.uh{font-size:12px;color:#A9B7AE;line-height:1.2}
.ub{height:6px;border-radius:3px;background:#2B3E34;margin:4px 0 3px;overflow:hidden}
.ub i{display:block;height:100%;background:#4FB58D;border-radius:3px}
.us{font-size:11px;color:#A9B7AE;line-height:1.2}
.msgs{flex:1;min-height:0;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:12px}
.tabs{height:64px;flex:none;display:flex;background:#141F19;border-top:1px solid #26382E}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#A9B7AE;font-weight:500}
.tab.on{color:#6BD0A4;font-weight:700}
.dock{flex:none;background:#141F19;border-radius:28px 28px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.45);padding:16px 20px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.hint{font-size:13px;color:#A9B7AE;text-align:center;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;line-height:1.4}
</style>
</helmet>
<div class="app">
  <header class="hd">
    <div class="who">
      <div class="av" aria-hidden="true">제</div>
      <div><div class="nm">제니</div><div class="st">대화 전</div></div>
    </div>
    <div class="use">
      <div class="uh">남은 토큰 62%</div>
      <div class="ub"><i style="width:62%"></i></div>
      <div class="us">3시간 뒤 초기화</div>
    </div>
  </header>

  <main class="msgs" style="gap:18px;padding-top:22px">
    <div>
      <h1 style="margin:0;font-size:24px;line-height:1.35;font-weight:700">걸으면서 이야기해요</h1>
      <p style="margin:6px 0 0;font-size:15px;line-height:1.5;color:#A9B7AE">버튼을 한 번 누르면 이어폰으로 대화가 시작돼요. 그 뒤로는 화면을 만지지 않아도 돼요.</p>
    </div>

    <section aria-label="지난 아이디어 이어 가기" style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:13px;font-weight:700;color:#A9B7AE">지난 아이디어 이어 가기</div>
      <button style="text-align:left;border:1px solid #2F4237;background:#17241D;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;color:#EDEAE0">
        <span style="font-size:12px;color:#A9B7AE">10월 21일</span>
        <span style="font-size:16px;line-height:1.5;font-weight:500">산책 코스에 맞춰 날씨 알림을 붙이면 어떨까</span>
        <span style="display:flex;gap:6px">
          <span class="pill" style="background:#1F3A2E;color:#9ADBB9">아이디어 2</span>
          <span class="pill" style="background:#3A2E14;color:#F0C26A">할 일 1</span>
        </span>
      </button>
      <button style="text-align:left;border:1px solid #2F4237;background:#17241D;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;color:#EDEAE0">
        <span style="font-size:12px;color:#A9B7AE">10월 19일</span>
        <span style="font-size:16px;line-height:1.5;font-weight:500">걸음 수 대신 오늘 떠오른 생각 수를 세 보기</span>
        <span style="display:flex;gap:6px">
          <span class="pill" style="background:#1F3A2E;color:#9ADBB9">아이디어 3</span>
          <span class="pill" style="background:#2A3A32;color:#CBD5CE">메모 1</span>
        </span>
      </button>
    </section>

    <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#A9B7AE">
      <span style="width:8px;height:8px;border-radius:50%;background:#4FB58D;display:inline-block"></span>
      서버에 연결됐어요
    </div>
  </main>

  <section class="dock" aria-label="대화 시작">
    <div style="display:flex;gap:4px;padding:4px;border-radius:999px;background:#0D1612;width:100%;box-sizing:border-box">
      <button style="flex:1;height:44px;border:0;border-radius:999px;background:#4FB58D;color:#0A1410;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        음성으로
      </button>
      <button style="flex:1;height:44px;border:0;border-radius:999px;background:transparent;color:#EDEAE0;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
        글로
      </button>
    </div>
    <button aria-label="음성 대화 시작" style="width:80px;height:80px;border-radius:50%;border:0;background:#4FB58D;color:#0A1410;box-shadow:0 0 0 8px #1F3A2E;display:flex;align-items:center;justify-content:center;margin:8px 0 4px">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:34px;height:34px"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <div class="hint">눌러서 시작해요</div>
  </section>

  <nav class="tabs" aria-label="메인 메뉴">
    <button class="tab on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>대화</button>
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6"/></svg>일지</button>
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>설정</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
