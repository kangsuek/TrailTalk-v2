<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>일지 제목 수정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer}
.app{width:360px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#F3F0E8;color:#16241D;overflow:hidden;position:relative}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd2{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 4px;border-bottom:1px solid #DDD8CB}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:none;color:#16241D;display:flex;align-items:center;justify-content:center;flex:none}
.body{flex:1;min-height:0;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:16px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;line-height:1.4}
.tabs{height:64px;flex:none;display:flex;background:#fff;border-top:1px solid #DDD8CB}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#4A5A52;font-weight:500}
.tab.on{color:#1D5B43;font-weight:700}
</style>
</helmet>
<div class="app">
  <header class="hd2">
    <button class="ib" aria-label="목록으로"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span style="font-size:16px;font-weight:700">일지</span>
    <button class="ib" aria-label="더 보기"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </header>

  <main class="body">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-size:13px;color:#4A5A52">10월 22일 (목) 오전 7:12 · 38분</div>
      <h1 style="margin:0;font-size:22px;line-height:1.35;font-weight:700">비 오기 전 알림 앱 아이디어</h1>
      <div style="display:flex;gap:6px;margin-top:4px"><span class="pill" style="background:#DCEBE2;color:#14452F">아이디어 3</span><span class="pill" style="background:#F7E6C4;color:#6E3B00">할 일 1</span></div>
    </div>
    <section style="background:#E3EFE7;border-radius:16px;padding:14px 16px">
      <div style="font-size:17px;line-height:1.55;font-weight:700">걷는 사람에게는 비 오기 30분 전 알림이 가장 쓸모 있다.</div>
    </section>
  </main>

  <nav class="tabs" aria-label="메인 메뉴">
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>대화</button>
    <button class="tab on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6"/></svg>일지</button>
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>설정</button>
  </nav>

  <div style="position:absolute;inset:0;background:rgba(22,36,29,.55);display:flex;align-items:flex-end">
    <div role="dialog" aria-label="제목 수정" style="width:100%;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
      <div style="width:40px;height:4px;border-radius:2px;background:#C9C3B3;align-self:center" aria-hidden="true"></div>
      <div style="font-size:18px;font-weight:700">제목 수정</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="t" style="font-size:13px;font-weight:700;color:#4A5A52">대화 제목</label>
        <input id="t" value="비 오기 전 알림 앱 아이디어 (산책용)" style="height:52px;box-sizing:border-box;border:2px solid #1D5B43;border-radius:14px;padding:0 14px;font-size:16px;color:#16241D;background:#fff">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#4A5A52">
          <span>다시 정리해도 제목은 바뀌지 않아요.</span>
          <span>21 / 200</span>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:6px">
        <button style="flex:1;height:52px;border:1.5px solid #C9C3B3;border-radius:16px;background:#fff;color:#16241D;font-size:16px;font-weight:500">취소</button>
        <button style="flex:1;height:52px;border:0;border-radius:16px;background:#1D5B43;color:#fff;font-size:16px;font-weight:700">저장</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
