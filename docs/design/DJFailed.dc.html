<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>일지 정리 실패 (다크)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0D1612}
button{font-family:inherit;cursor:pointer}
.app{width:360px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#0D1612;color:#EDEAE0;overflow:hidden}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd2{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 4px;border-bottom:1px solid #26382E}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:none;color:#EDEAE0;display:flex;align-items:center;justify-content:center;flex:none}
.body{flex:1;min-height:0;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:16px}
.who{font-size:12px;font-weight:700;color:#A9B7AE;margin:0 4px 3px}
.u{align-self:flex-end;max-width:84%;background:#2B7A5A;color:#fff;padding:9px 13px;border-radius:16px 16px 4px 16px;font-size:15px;line-height:1.55}
.j{align-self:flex-start;max-width:90%;background:#17241D;border:1px solid #2F4237;padding:9px 13px;border-radius:16px 16px 16px 4px;font-size:15px;line-height:1.55}
.act{flex:none;background:#141F19;border-top:1px solid #26382E;padding:10px 16px;display:flex;gap:10px}
.tabs{height:64px;flex:none;display:flex;background:#141F19;border-top:1px solid #26382E}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#A9B7AE;font-weight:500}
.tab.on{color:#6BD0A4;font-weight:700}
</style>
</helmet>
<div class="app">
  <header class="hd2">
    <button class="ib" aria-label="목록으로"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span style="font-size:16px;font-weight:700">일지</span>
    <button class="ib" aria-label="더 보기"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </header>

  <main class="body">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-size:13px;color:#A9B7AE">10월 21일 (수) 오전 6:10 · 3분</div>
      <h1 style="margin:0;font-size:22px;line-height:1.35;font-weight:700">제목 없는 대화</h1>
    </div>

    <section role="alert" aria-label="정리 실패" style="background:#3A1E18;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:#F5B9AB;margin-top:1px"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg>
        <div>
          <div style="font-size:16px;font-weight:700;color:#FAD0C5">일지를 정리하지 못했어요</div>
          <div style="font-size:14px;line-height:1.5;color:#F5B9AB;margin-top:2px">대화 내용은 그대로 남아 있어요. 다시 정리하면 요약과 노트가 만들어져요.</div>
        </div>
      </div>
      <button style="width:100%;height:52px;border:0;border-radius:14px;background:#E8806B;color:#1A0A06;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg>
        다시 정리
      </button>
    </section>

    <div style="font-size:16px;font-weight:700;padding:0 2px">전문</div>

    <div style="display:flex;flex-direction:column;align-items:flex-start">
      <div class="who">제니</div>
      <div class="j">좋은 아침이에요! 오늘은 무슨 생각 하면서 걸을까요?</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end">
      <div class="who">나</div>
      <div class="u">어제 본 거 있잖아, 그거 이어서 이야기해도 돼?</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-start">
      <div class="who">제니</div>
      <div class="j">그럼요! 어제 얘기하던 부분부터 같이 볼까요?</div>
    </div>
  </main>

  <div class="act">
    <button style="flex:1;height:52px;border:1.5px solid #4FB58D;border-radius:16px;background:transparent;color:#9ADBB9;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
      글로 이어서
    </button>
    <button style="flex:1;height:52px;border:0;border-radius:16px;background:#4FB58D;color:#0A1410;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      음성으로 이어서
    </button>
  </div>

  <nav class="tabs" aria-label="메인 메뉴">
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>대화</button>
    <button class="tab on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6"/></svg>일지</button>
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>설정</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
