<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>검색 중</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.app{width:360px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#F3F0E8;color:#16241D;overflow:hidden}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #DDD8CB}
.who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:#1D5B43;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.nm{font-size:16px;font-weight:700;line-height:1.2}
.st{font-size:13px;color:#4A5A52;line-height:1.2;margin-top:2px}
.use{width:108px;text-align:right}
.uh{font-size:12px;color:#4A5A52;line-height:1.2}
.ub{height:6px;border-radius:3px;background:#DDD8CB;margin:4px 0 3px;overflow:hidden}
.ub i{display:block;height:100%;background:#1D5B43;border-radius:3px}
.us{font-size:11px;color:#4A5A52;line-height:1.2}
.msgs{flex:1;min-height:0;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:12px}
.u{align-self:flex-end;max-width:80%;background:#1D5B43;color:#fff;padding:10px 14px;border-radius:18px 18px 4px 18px;font-size:16px;line-height:1.55}
.j{align-self:flex-start;max-width:88%;background:#fff;border:1px solid #DDD8CB;padding:10px 14px;border-radius:18px 18px 18px 4px;font-size:16px;line-height:1.55}
.tabs{height:64px;flex:none;display:flex;background:#fff;border-top:1px solid #DDD8CB}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#4A5A52;font-weight:500}
.tab.on{color:#1D5B43;font-weight:700}
.dock{flex:none;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -6px 24px rgba(22,36,29,.08);padding:16px 20px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.row{display:grid;grid-template-columns:52px 80px 52px;justify-content:space-between;align-items:start;width:100%}
.sb{width:52px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#4A5A52;font-weight:500;white-space:nowrap}
.sb button{width:48px;height:48px;border-radius:50%;border:1.5px solid #C9C3B3;background:#fff;color:#16241D;display:flex;align-items:center;justify-content:center}
.hint{font-size:13px;color:#4A5A52;text-align:center;line-height:1.4}
</style>
</helmet>
<div class="app">
  <header class="hd">
    <div class="who">
      <div class="av" aria-hidden="true">제</div>
      <div><div class="nm">제니</div><div class="st" style="color:#6E3B00;font-weight:700">찾아보는 중</div></div>
    </div>
    <div class="use">
      <div class="uh">남은 토큰 61%</div>
      <div class="ub"><i style="width:61%"></i></div>
      <div class="us">3시간 뒤 초기화</div>
    </div>
  </header>

  <main class="msgs" style="justify-content:flex-end">
    <div class="u">오늘 서울 날씨 검색해서 알려 줘.</div>

    <div class="j" style="display:flex;align-items:center;gap:8px">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;color:#4A5A52"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
      잠깐만요, 찾아볼게요!
    </div>

    <section aria-label="검색 진행" style="align-self:stretch;background:#fff;border:1px solid #DDD8CB;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:8px">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px;color:#6E3B00"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></svg>
        <span style="font-size:14px;font-weight:700;color:#6E3B00">검색 중</span>
        <span style="font-size:13px;color:#4A5A52">네이버 뉴스</span>
      </div>
      <div style="font-size:15px;line-height:1.45">서울 오늘 날씨</div>
      <div style="display:flex;flex-direction:column;gap:6px" aria-hidden="true">
        <i style="display:block;height:10px;border-radius:5px;background:#E6E2D6;width:92%"></i>
        <i style="display:block;height:10px;border-radius:5px;background:#E6E2D6;width:78%"></i>
        <i style="display:block;height:10px;border-radius:5px;background:#E6E2D6;width:54%"></i>
      </div>
    </section>

    <div style="align-self:flex-start;display:flex;gap:6px;flex-wrap:wrap">
      <span style="font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:#EEEADF;border:1px solid #DDD8CB;color:#16241D">weather.naver.com</span>
      <span style="font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:#EEEADF;border:1px solid #DDD8CB;color:#16241D">kma.go.kr</span>
    </div>
  </main>

  <section class="dock" aria-label="대화 조작">
    <div style="display:flex;gap:4px;padding:4px;border-radius:999px;background:#EEEADF;width:100%;box-sizing:border-box">
      <button style="flex:1;height:44px;border:0;border-radius:999px;background:#1D5B43;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        음성으로
      </button>
      <button style="flex:1;height:44px;border:0;border-radius:999px;background:transparent;color:#16241D;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
        글로
      </button>
    </div>
    <div class="row" style="margin-top:0">
      <div class="sb" style="opacity:.5">
        <button aria-label="일시 중단" aria-disabled="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        일시 중단
      </div>
      <button aria-label="검색 중. 누르면 멈추고 다시 듣기" style="width:80px;height:80px;border-radius:50%;border:6px solid #9C5C00;background:#fff;color:#16241D;box-shadow:0 0 0 8px #F7E6C4;display:flex;align-items:center;justify-content:center;box-sizing:border-box">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:34px;height:34px"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></svg>
      </button>
      <div class="sb">
        <button aria-label="대화 종료"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
        대화종료
      </div>
    </div>
    <div class="hint" style="margin-top:6px">찾는 데 몇 초 걸려요 · 누르면 멈춰요</div>
  </section>

  <nav class="tabs" aria-label="메인 메뉴">
    <button class="tab on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>대화</button>
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6"/></svg>일지</button>
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>설정</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
