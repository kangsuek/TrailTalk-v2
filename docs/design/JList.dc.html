<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>일지 목록 (날짜별)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.app{width:360px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#F3F0E8;color:#16241D;overflow:hidden}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd2{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;border-bottom:1px solid #DDD8CB}
.ttl{font-size:20px;font-weight:700}
.tbtn{border:0;background:none;min-height:44px;padding:0 12px;font-size:15px;font-weight:700;color:#14452F}
.ctl{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px}
.list{flex:1;min-height:0;overflow:hidden;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.dh{font-size:13px;font-weight:700;color:#4A5A52;padding:6px 2px 0}
.card{background:#fff;border:1px solid #DDD8CB;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:#16241D;width:100%;box-sizing:border-box}
.meta{font-size:12px;color:#4A5A52}
.ct{font-size:16px;font-weight:700;line-height:1.4}
.cs{font-size:14px;line-height:1.5;color:#4A5A52;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;line-height:1.4}
.tabs{height:64px;flex:none;display:flex;background:#fff;border-top:1px solid #DDD8CB}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#4A5A52;font-weight:500}
.tab.on{color:#1D5B43;font-weight:700}
</style>
</helmet>
<div class="app">
  <header class="hd2">
    <h1 class="ttl" style="margin:0">일지</h1>
    <button class="tbtn">선택</button>
  </header>

  <main class="list">
    <div class="dh">10월 22일 (목)</div>
    <button class="card" style="border:2px solid #1D5B43;background:#F1F7F3">
      <span class="meta">오전 9:05 · 진행 중</span>
      <span class="ct">산책길 날씨 이야기</span>
      <span style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <span class="pill" style="background:#1D5B43;color:#fff"><i style="width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block" aria-hidden="true"></i>대화 중</span>
        <span style="font-size:13px;font-weight:700;color:#14452F;display:flex;align-items:center;gap:2px">대화로 돌아가기<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M9 6l6 6-6 6"/></svg></span>
      </span>
    </button>
    <button class="card">
      <span class="meta">오전 7:12 · 38분</span>
      <span class="ct">비 오기 전 알림 앱 아이디어</span>
      <span class="cs">걷는 사람에게는 비 오기 30분 전 알림이 가장 쓸모 있다.</span>
      <span style="display:flex;gap:6px"><span class="pill" style="background:#DCEBE2;color:#14452F">아이디어 3</span><span class="pill" style="background:#F7E6C4;color:#6E3B00">할 일 1</span></span>
    </button>
    <button class="card">
      <span class="meta">오전 6:20 · 12분</span>
      <span class="ct">저녁 산책 코스 고민</span>
      <span style="display:flex;align-items:center;gap:6px;font-size:13px;color:#6E3B00;font-weight:700">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
        일지를 정리하고 있어요
      </span>
    </button>

    <div class="dh">10월 21일 (수)</div>
    <button class="card">
      <span class="meta">오전 6:55 · 41분</span>
      <span class="ct">하루에 떠오른 생각 수를 세어 보기</span>
      <span class="cs">걸음 수 대신 생각 수를 세면 걷는 시간이 기록처럼 남는다.</span>
      <span style="display:flex;gap:6px"><span class="pill" style="background:#DCEBE2;color:#14452F">아이디어 3</span><span class="pill" style="background:#E6E2D6;color:#2F3A34">메모 1</span></span>
    </button>
    <div class="card" style="border-color:#E5B9AE;background:#FFF8F6">
      <span class="meta">오전 6:10 · 3분</span>
      <span class="ct">제목 없는 대화</span>
      <span style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <span class="pill" style="background:#F6DDD7;color:#6E1E10">정리 실패</span>
        <button style="border:1.5px solid #8A2615;background:#fff;color:#8A2615;border-radius:999px;font-size:13px;font-weight:700;min-height:44px;padding:0 14px">다시 정리</button>
      </span>
    </div>
  </main>

  <nav class="tabs" aria-label="메인 메뉴">
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>대화</button>
    <button class="tab on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6"/></svg>일지</button>
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>설정</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
