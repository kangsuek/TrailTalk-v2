<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>일지 상세 · 노트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.app{width:360px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#F3F0E8;color:#16241D;overflow:hidden}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd2{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 4px;border-bottom:1px solid #DDD8CB}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:none;color:#16241D;display:flex;align-items:center;justify-content:center;flex:none}
.body{flex:1;min-height:0;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:12px}
.sh{font-size:13px;font-weight:700;color:#4A5A52;display:flex;align-items:center;justify-content:space-between}
.note{background:#fff;border:1px solid #DDD8CB;border-radius:16px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:6px;min-height:56px}
.nt{flex:1;font-size:16px;line-height:1.5;padding:6px 0}
sup{font-size:11px;font-weight:700;color:#14452F;margin-left:1px}
.act{flex:none;background:#fff;border-top:1px solid #DDD8CB;padding:10px 16px;display:flex;gap:10px}
.tabs{height:64px;flex:none;display:flex;background:#fff;border-top:1px solid #DDD8CB}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#4A5A52;font-weight:500}
.tab.on{color:#1D5B43;font-weight:700}
</style>
</helmet>
<div class="app">
  <header class="hd2">
    <button class="ib" aria-label="목록으로"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span style="font-size:16px;font-weight:700">일지</span>
    <button class="ib" aria-label="더 보기"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </header>

  <main class="body">
    <div class="sh"><span>아이디어 3</span><span style="font-weight:500">별표를 누르면 위로 올라가요</span></div>

    <div class="note">
      <span class="nt">비 오기 30분 전에 알려 주는 날씨 알림<sup>[1]</sup></span>
      <button class="ib" aria-label="별표 해제" style="color:#9C5C00"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
      <button class="ib" aria-label="완료로 표시" style="color:#4A5A52"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg></button>
    </div>

    <div class="note">
      <span class="nt">쉴 만한 곳을 알림에 함께 보여 주기</span>
      <button class="ib" aria-label="별표" style="color:#4A5A52"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
      <button class="ib" aria-label="완료로 표시" style="color:#4A5A52"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg></button>
    </div>

    <div class="note" style="background:#EEEADF">
      <span class="nt" style="text-decoration:line-through;color:#4A5A52">이어폰 한쪽만 써도 되게 하기</span>
      <span style="font-size:12px;font-weight:700;color:#14452F;background:#DCEBE2;border-radius:999px;padding:3px 9px">완료</span>
      <button class="ib" aria-label="완료 취소" style="color:#1D5B43"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" style="fill:currentColor"/><path d="M8 12l3 3 5-6" style="stroke:#fff"/></svg></button>
    </div>

    <div class="sh" style="margin-top:6px"><span>할 일 1</span></div>
    <div class="note">
      <button class="ib" aria-label="완료로 표시" style="color:#4A5A52;margin-left:-8px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/></svg></button>
      <span class="nt" style="margin-left:-6px">내일 기상청 동네예보 자료가 어떻게 오는지 알아보기</span>
      <button class="ib" aria-label="내용 수정" style="color:#4A5A52"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></svg></button>
    </div>

    <div class="sh" style="margin-top:6px"><span>메모 0</span></div>
    <div style="font-size:14px;color:#4A5A52;padding:0 2px">저장한 메모가 없어요.</div>

    <div style="display:flex;gap:8px;margin-top:6px">
      <button style="flex:1;min-height:48px;border:1.5px solid #C9C3B3;border-radius:14px;background:#fff;color:#16241D;font-size:14px;font-weight:500">다시 정리</button>
      <button style="flex:1;min-height:48px;border:1.5px solid #E5B9AE;border-radius:14px;background:#fff;color:#8A2615;font-size:14px;font-weight:700">대화 지우기</button>
    </div>
  </main>

  <div class="act">
    <button style="flex:1;height:52px;border:1.5px solid #1D5B43;border-radius:16px;background:#fff;color:#14452F;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
      글로 이어서
    </button>
    <button style="flex:1;height:52px;border:0;border-radius:16px;background:#1D5B43;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      음성으로 이어서
    </button>
  </div>

  <nav class="tabs" aria-label="메인 메뉴">
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>대화</button>
    <button class="tab on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6"/></svg>일지</button>
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>설정</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
